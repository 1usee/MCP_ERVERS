<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP 音频生成工具</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">本地 MCP 工作台</p>
          <h1>音频生成与语音交互</h1>
        </div>
        <button id="settingsBtn" class="icon-button" type="button">API 设置</button>
      </header>

      <main>
        <section id="mainView" class="view">
          <div class="panel">
            <section class="request card">
              <h2>输入内容</h2>

              <label class="field">
                <span>上传音频文件</span>
                <input id="audioFile" type="file" accept=".wav,.mp3,audio/wav,audio/mpeg" />
              </label>

              <label class="field">
                <span>文本提示词</span>
                <textarea id="prompt" rows="5" placeholder="例如：请根据这段音频内容进行回答，并用自然语音回复。">请根据这段音频内容回答，并用自然语音输出。</textarea>
              </label>

              <div class="actions">
                <button id="submitBtn" class="primary">发送请求</button>
                <button id="resetBtn" class="secondary" type="button">清空</button>
              </div>

              <div id="status" class="status" aria-live="polite"></div>
            </section>

            <section class="result card">
              <h2>返回结果</h2>

              <div class="result-block">
                <label class="field">
                  <span>模型回复文字</span>
                  <textarea id="responseText" rows="6" readonly placeholder="返回的文字将显示在这里"></textarea>
                </label>
              </div>

              <div class="audio-block">
                <div class="result-label-row">
                  <span class="result-label">生成音频文件</span>
                  <span id="audioResultStatus" class="audio-result-status">等待生成</span>
                </div>
                <div id="audioFileInfo" class="audio-file-info hidden">
                  <div class="audio-file-detail">
                    <span class="detail-label">文件名称</span>
                    <strong id="audioFileName">-</strong>
                  </div>
                  <div class="audio-file-detail">
                    <span class="detail-label">生成时间</span>
                    <strong id="audioCreatedAt">-</strong>
                  </div>
                  <div class="audio-file-detail">
                    <span class="detail-label">文件大小</span>
                    <strong id="audioFileSize">-</strong>
                  </div>
                  <a id="downloadLink" class="download" href="#" download="output.wav">保存音频文件</a>
                </div>
              </div>
            </section>
          </div>
        </section>

        <section id="settingsView" class="view hidden">
          <div class="subpage-header">
            <button id="backBtn" class="back-button" type="button">← 返回工作台</button>
            <div>
              <p class="eyebrow">连接管理</p>
              <h2>API 设置</h2>
            </div>
          </div>

          <div class="settings-layout">
            <section class="card">
              <h2>模型配置</h2>
              <div class="field-row two-col">
                <label class="field">
                  <span>模型名称</span>
                  <select id="modelSelect">
                    <option value="" selected disabled>请先获取模型名称</option>
                    <option value="custom">自定义模型</option>
                  </select>
                </label>

                <label class="field custom-model hidden" id="customModelWrap">
                  <span>自定义模型</span>
                  <input id="customModel" type="text" placeholder="例如：qwen-omni-turbo" />
                </label>
              </div>
              <div class="actions">
                <button id="fetchModelsBtn" class="secondary" type="button">获取模型名称</button>
              </div>
            </section>

            <section class="card api-card">
              <h2>API Key</h2>
              <p class="helper-text">添加多个 Key，并选择当前请求使用的 Key。</p>
              <label class="field">
                <span>Base URL</span>
                <input id="baseUrlInput" type="url" placeholder="https://dashscope-intl.aliyuncs.com/compatible-mode/v1" />
              </label>
              <div class="actions">
                <button id="saveBaseUrlBtn" class="secondary" type="button">保存 Base URL</button>
              </div>
              <div class="api-add-row">
                <input id="apiKeyInput" type="password" placeholder="请输入 DASHSCOPE_API_KEY" />
                <button id="addApiBtn" class="primary" type="button">添加</button>
              </div>
              <div id="apiList" class="api-list" aria-live="polite"></div>
              <div id="apiStatus" class="status" aria-live="polite"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
